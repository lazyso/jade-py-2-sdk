<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>IPC 双向通信测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Segoe UI", sans-serif; background: #f8f9fa; padding: 20px; }
h1 { font-size: 18px; margin-bottom: 16px; }
.panel { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.box { background: #fff; border-radius: 8px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.box h2 { font-size: 13px; color: #666; margin-bottom: 10px; }
input, textarea { width: 100%; padding: 6px 10px; border: 1px solid #d0d5dd; border-radius: 4px; font-size: 13px; font-family: inherit; }
textarea { height: 60px; resize: vertical; }
button { margin-top: 8px; padding: 6px 16px; border: 1px solid #4a90d9; border-radius: 4px; background: #4a90d9; color: #fff; cursor: pointer; font-size: 12px; }
button:hover { background: #3a7bc8; }
button.secondary { background: #fff; color: #4a90d9; }
button.secondary:hover { background: #e8f0fe; }
#log { background: #1e1e2e; color: #cdd6f4; border-radius: 8px; padding: 12px; font-family: Consolas, monospace; font-size: 11px; height: 260px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.log-in { color: #89b4fa; }
.log-out { color: #a6e3a1; }
.log-info { color: #fab387; }
.stats { display: flex; gap: 20px; margin: 10px 0; font-size: 12px; color: #666; }
.stats span { font-weight: 600; color: #333; }
</style>
</head>
<body>
<h1>IPC 双向通信测试</h1>

<div class="panel">
  <div class="box">
    <h2>前端 → Python (jade.invoke)</h2>
    <input type="text" id="channel" placeholder="通道名" value="ipc:echo">
    <textarea id="payload" placeholder="载荷 (字符串或JSON)" style="margin-top:6px;">{"text":"你好","ts":0}</textarea>
    <div style="display:flex;gap:6px;">
      <button onclick="sendInvoke()">发送</button>
      <button class="secondary" onclick="burstInvoke()">连发 100 条</button>
    </div>
  </div>
  <div class="box">
    <h2>Python → 前端 (jade.on 监听)</h2>
    <input type="text" id="listenType" placeholder="监听消息类型" value="server-push">
    <button onclick="toggleListen()" id="listenBtn" style="margin-top:6px;">开始监听</button>
    <div class="stats">
      收到: <span id="recvCount">0</span> 条
    </div>
  </div>
</div>

<div id="log"></div>

<script>
const logEl = document.getElementById('log');
let recvCount = 0;
let listening = false;

function log(dir, msg) {
  const t = new Date().toLocaleTimeString('zh-CN', {hour12:false, fractionalSecondDigits:3});
  const cls = dir === 'in' ? 'log-in' : dir === 'out' ? 'log-out' : 'log-info';
  const arrow = dir === 'in' ? '→' : dir === 'out' ? '←' : '●';
  logEl.innerHTML += `<span style="color:#6c7086">[${t}]</span> <span class="${cls}">${arrow} ${msg}</span>\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

async function sendInvoke() {
  const ch = document.getElementById('channel').value;
  const payload = document.getElementById('payload').value;
  log('out', `invoke(${ch}, ${payload})`);
  try {
    const r = await jade.invoke(ch, payload);
    log('in', `返回: ${typeof r === 'object' ? JSON.stringify(r) : r}`);
  } catch(e) {
    log('info', `错误: ${e.message}`);
  }
}

async function burstInvoke() {
  const ch = document.getElementById('channel').value;
  const start = performance.now();
  log('info', `开始连发 100 条到 ${ch}...`);
  for (let i = 0; i < 100; i++) {
    await jade.invoke(ch, JSON.stringify({seq: i}));
  }
  const elapsed = (performance.now() - start).toFixed(1);
  log('info', `100 条完成，耗时 ${elapsed}ms，平均 ${(elapsed/100).toFixed(2)}ms/条`);
}

function toggleListen() {
  const type = document.getElementById('listenType').value;
  const btn = document.getElementById('listenBtn');
  if (!listening) {
    jade.on(type, (data) => {
      recvCount++;
      document.getElementById('recvCount').textContent = recvCount;
      log('in', `[${type}] ${JSON.stringify(data)}`);
    });
    listening = true;
    btn.textContent = '监听中...';
    log('info', `已注册监听: ${type}`);
  }
}

log('info', 'IPC 测试页已加载');
</script>
</body>
</html>
