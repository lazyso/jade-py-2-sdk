<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>JadeView 2.1.1 SDK 全功能演示</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Segoe UI", "PingFang SC", sans-serif;
  color: #0f172a;
  padding: 20px;
  min-height: 100vh;
  background: linear-gradient(135deg, #f0f4ff 0%, #e0ecff 50%, #f0f4ff 100%);
}
h1 { font-size: 20px; margin-bottom: 14px; color: #0f172a; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.card {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 4px 24px rgba(37,99,235,0.08);
}
.card h2 { font-size: 13px; color: #334155; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; font-weight: 600; letter-spacing: 0.02em; }
.btn-group { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  padding: 6px 14px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-size: 12px;
  color: #334155;
  transition: all .15s ease;
}
button:hover { border-color: #2563eb; color: #2563eb; background: rgba(37,99,235,0.04); }
button:active { background: rgba(37,99,235,0.08); }
button.primary {
  background: linear-gradient(135deg, #2563eb, #1e40af);
  color: #fff;
  border: none;
  font-weight: 500;
}
button.primary:hover { background: linear-gradient(135deg, #1d4ed8, #1e3a8a); box-shadow: 0 2px 8px rgba(37,99,235,0.25); }
button.danger { color: #dc2626; border-color: #fca5a5; }
button.danger:hover { background: #fef2f2; border-color: #dc2626; }
#log {
  margin-top: 14px;
  background: #0f172a;
  color: #cbd5e1;
  border-radius: 10px;
  padding: 12px;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 11px;
  height: 200px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  box-shadow: 0 4px 24px rgba(15,23,42,0.12);
}
.log-time { color: #64748b; }
.log-event { color: #38bdf8; }
.log-data { color: #4ade80; }
.log-error { color: #f87171; }
select, input[type=text], input[type=number] {
  padding: 5px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 12px;
  background: rgba(255,255,255,0.8);
  transition: border-color .15s;
}
select:focus, input[type=text]:focus, input[type=number]:focus { outline: none; border-color: #2563eb; }
.row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
label { font-size: 12px; color: #64748b; min-width: 60px; }
</style>
</head>
<body>
<h1>JadeView 2.1.1 SDK - 全功能演示面板</h1>
<div class="grid">

<!-- 窗口管理 -->
<div class="card">
  <h2>窗口管理</h2>
  <div class="btn-group">
    <button onclick="invoke('win:create')">创建新窗口</button>
    <button onclick="invoke('win:create_borderless')">无边框窗口</button>
    <button onclick="invoke('win:set_title')">修改标题</button>
    <button onclick="invoke('win:set_size')">调整大小</button>
    <button onclick="invoke('win:set_position')">设置位置</button>
    <button onclick="invoke('win:minimize')">最小化</button>
    <button onclick="invoke('win:toggle_maximize')">切换最大化</button>
    <button onclick="invoke('win:fullscreen')">全屏切换</button>
    <button onclick="invoke('win:always_on_top')">置顶切换</button>
    <button onclick="invoke('win:set_enabled')">禁用/启用</button>
    <button onclick="invoke('win:hide_show')">隐藏/显示</button>
    <button onclick="invoke('win:focus')">获取焦点</button>
    <button onclick="invoke('win:redraw')">请求重绘</button>
    <button class="danger" onclick="invoke('win:close_last')">关闭最后窗口</button>
  </div>
</div>

<!-- 主题与外观 -->
<div class="card">
  <h2>主题与外观</h2>
  <div class="btn-group">
    <button onclick="invoke('theme:light')">亮色主题</button>
    <button onclick="invoke('theme:dark')">暗色主题</button>
    <button onclick="invoke('theme:system')">跟随系统</button>
  </div>
  <div class="btn-group" style="margin-top:6px;">
    <button onclick="invoke('backdrop:mica')">Mica</button>
    <button onclick="invoke('backdrop:micaAlt')">Mica Alt</button>
    <button onclick="invoke('backdrop:acrylic')">Acrylic</button>
  </div>
  <div class="row" style="margin-top:6px;">
    <label>背景色</label>
    <input type="text" id="bgColor" value="#e8f0fe" style="width:80px;">
    <button onclick="invoke('theme:bgcolor', document.getElementById('bgColor').value)">应用</button>
  </div>
</div>

<!-- 边框样式 -->
<div class="card">
  <h2>边框样式 / 打印</h2>
  <div class="btn-group">
    <button onclick="invoke('frame:set_style', 'normal')">Normal</button>
    <button onclick="invoke('frame:set_style', 'no-titlebar')">No Titlebar</button>
    <button onclick="invoke('frame:set_style', 'borderless')">Borderless</button>
    <button onclick="invoke('frame:set_style', 'title-overlay')">Title Overlay</button>
  </div>
  <div class="btn-group" style="margin-top:8px;">
    <button class="primary" onclick="invoke('frame:open_overlay_demo')">打开 Overlay 演示窗口</button>
    <button onclick="invoke('frame:print')">打印页面</button>
  </div>
</div>

<!-- WebView 操作 -->
<div class="card">
  <h2>WebView 操作</h2>
  <div class="row">
    <input type="text" id="navUrl" value="https://example.com" style="flex:1;">
    <button onclick="invoke('webview:navigate', document.getElementById('navUrl').value)">导航</button>
  </div>
  <div class="btn-group">
    <button onclick="invoke('webview:reload')">刷新页面</button>
    <button onclick="invoke('webview:exec_js')">执行JS</button>
    <button onclick="invoke('webview:zoom_in')">放大 150%</button>
    <button onclick="invoke('webview:zoom_reset')">缩放 100%</button>
    <button onclick="invoke('webview:content_protect')">内容保护切换</button>
  </div>
</div>

<!-- IPC 通信 -->
<div class="card">
  <h2>IPC 通信</h2>
  <div class="row">
    <input type="text" id="ipcMsg" value="Hello from Frontend!" style="flex:1;">
    <button class="primary" onclick="invoke('ipc:send', document.getElementById('ipcMsg').value)">发送到Python</button>
  </div>
  <div class="btn-group">
    <button onclick="invoke('ipc:ping')">Ping 测试</button>
    <button onclick="invoke('ipc:get_info')">获取系统信息</button>
    <button onclick="invoke('win:create')">打开IPC测试页</button>
  </div>
</div>

<!-- 对话框 -->
<div class="card">
  <h2>对话框</h2>
  <div class="btn-group">
    <button onclick="invoke('dialog:open_file')">打开文件</button>
    <button onclick="invoke('dialog:open_files')">多选文件</button>
    <button onclick="invoke('dialog:open_folder')">选择文件夹</button>
    <button onclick="invoke('dialog:save')">保存文件</button>
    <button onclick="invoke('dialog:msg_info')">信息提示</button>
    <button onclick="invoke('dialog:msg_warning')">警告提示</button>
    <button onclick="invoke('dialog:msg_error')">错误提示</button>
    <button onclick="invoke('dialog:error_box')">ErrorBox</button>
  </div>
</div>

<!-- 系统托盘 -->
<div class="card">
  <h2>系统托盘</h2>
  <div class="btn-group">
    <button onclick="invoke('tray:create')">创建托盘</button>
    <button onclick="invoke('tray:set_tooltip')">设置提示文本</button>
    <button onclick="invoke('tray:set_menu')">设置菜单</button>
    <button onclick="invoke('tray:toggle_visible')">显示/隐藏</button>
    <button class="danger" onclick="invoke('tray:destroy')">销毁托盘</button>
  </div>
</div>

<!-- 系统通知 -->
<div class="card">
  <h2>系统通知</h2>
  <div class="btn-group">
    <button onclick="invoke('notify:basic')">基本通知</button>
    <button onclick="invoke('notify:with_buttons')">带按钮通知</button>
    <button onclick="invoke('notify:with_action')">带动作通知</button>
  </div>
</div>

<!-- 工具函数 -->
<div class="card">
  <h2>工具函数</h2>
  <div class="btn-group">
    <button onclick="invoke('tools:versions')">版本信息</button>
    <button onclick="invoke('tools:paths')">系统路径</button>
    <button onclick="invoke('tools:locale')">系统语言</button>
    <button onclick="invoke('tools:displays')">显示器信息</button>
    <button onclick="invoke('tools:win_count')">窗口数量</button>
    <button onclick="invoke('tools:is_win11')">是否Win11</button>
  </div>
  <div class="btn-group" style="margin-top:6px;">
    <button onclick="invoke('tools:yaml_set')">YAML写入</button>
    <button onclick="invoke('tools:yaml_get')">YAML读取</button>
    <button onclick="invoke('tools:hotkey_reg')">注册热键 Ctrl+Alt+K</button>
    <button onclick="invoke('tools:hotkey_unreg')">注销热键</button>
  </div>
</div>

<!-- 性能测试 -->
<div class="card">
  <h2>性能测试</h2>
  <div class="btn-group">
    <button class="primary" onclick="invoke('bench:open_window')">打开性能测试面板</button>
  </div>
</div>

</div>

<!-- 事件日志 -->
<div id="log"></div>

<script>
const logEl = document.getElementById('log');

function log(type, msg) {
  const t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  const cls = type === 'error' ? 'log-error' : type === 'event' ? 'log-event' : 'log-data';
  logEl.innerHTML += `<span class="log-time">[${t}]</span> <span class="${cls}">${msg}</span>\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

async function invoke(channel, data) {
  try {
    const result = await jade.invoke(channel, data || '');
    if (result) log('data', `← ${channel}: ${typeof result === 'object' ? JSON.stringify(result) : result}`);
  } catch(e) {
    log('error', `${channel} 错误: ${e.message}`);
  }
}

jade.on('event-log', (data) => {
  log('event', data.message || JSON.stringify(data));
});

jade.on('js-result', (data) => {
  log('data', `JS执行结果: ${JSON.stringify(data)}`);
});

log('data', '面板已加载，等待操作...');
</script>
</body>
</html>
