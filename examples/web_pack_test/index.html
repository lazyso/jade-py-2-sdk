<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JadeView Pack Test</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<h1>JadeView 2.1.1 SDK - 打包手测面板</h1>
<p class="lead">默认先加载当前目录。你可以在运行中的页面里手动选择 <code>.japk</code> 文件切换验证，也可以随时切回目录版资源。</p>

<div class="grid">

  <!-- 操作 -->
  <div class="card">
    <h2>操作</h2>
    <div class="btn-group">
      <button class="primary" id="ping-btn">测试 IPC</button>
      <button id="info-btn">读取资源信息</button>
      <button id="choose-btn">选择 JAPK</button>
      <button id="reset-btn">切回目录</button>
    </div>
  </div>

  <!-- 静态资源检查 -->
  <div class="card">
    <h2>静态资源检查</h2>
    <ul class="resource-list">
      <li>HTML: <code>index.html</code></li>
      <li>CSS: <code>style.css</code></li>
      <li>JS: <code>app.js</code></li>
      <li>JSON: <code>assets/info.json</code></li>
    </ul>
  </div>

  <!-- 当前载入源 -->
  <div class="card">
    <h2>当前载入源</h2>
    <pre id="asset-info">加载中...</pre>
  </div>

</div>

<!-- 运行日志 -->
<div id="log">等待操作...</div>

<script src="./app.js" type="module"></script>
</body>
</html>
