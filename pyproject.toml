[project]
name = "jadeview"
version = "2.0.0"
description = "JadeView 2.0 Python SDK - WebView2 桌面应用框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}
authors = [{name = "lazyso"}]
keywords = ["jadeview", "webview2", "desktop", "gui", "windows","pythongui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://jade.run"
Documentation = "https://jade.run/python-sdk2"
Repository = "https://github.com/lazyso/jade-py-2-sdk"
Issues = "https://github.com/lazyso/jade-py-2-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jadeview"]

[tool.hatch.build.targets.sdist]
exclude = ["jadeview/dll/**"]

# DLL 已通过 packages=["jadeview"] 自动包含在 wheel 中，无需 force-include
